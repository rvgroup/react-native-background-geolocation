name: Android reliability

on:
  push:
    branches: [develop, 'improve/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test and build without Jetifier (release uses R8)
        run: >-
          bash android/gradlew -p android/verification
          :app:assembleDebug :app:assembleRelease :app:verifyAndroidXDependencies
          :@thekingzoom_react-native-background-geolocation-common:testDebugUnitTest
          :@thekingzoom_react-native-background-geolocation-common:assembleDebug
          :@thekingzoom_react-native-background-geolocation-common:assembleRelease
          --console=plain
      - name: Scan library bytecode
        run: python3 scripts/verify-androidx-bytecode.py android/common/build/outputs/aar/*.aar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/common/build/reports/tests/
            android/common/build/test-results/
            android/verification/app/build/outputs/apk/
            android/verification/app/build/outputs/mapping/
