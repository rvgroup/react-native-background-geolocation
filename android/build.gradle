
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            // Force consistent slf4j version to avoid conflicts
            force 'org.slf4j:slf4j-api:1.7.36'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

