buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

ext {
    minSdkVersion = 24
    compileSdkVersion = 37
    targetSdkVersion = 36
    reactNativeLibVersion = '0.87.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
