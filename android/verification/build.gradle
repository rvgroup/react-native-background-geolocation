buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

ext {
    minSdkVersion = 24
    compileSdkVersion = 37
    targetSdkVersion = 36
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.configureEach {
        resolutionStrategy.force 'com.facebook.react:react-android:0.87.1'
    }
}
